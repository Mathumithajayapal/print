<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Create Account | PrintOn - Custom Merchandise</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontWeight: {
                        semibold: '500',
                        bold: '600',
                        extrabold: '800',
                        black: '900'
                    },
                    colors: {
                        indigo: {
                            400: '#818CF8',
                            500: '#6366F1',
                            600: '#4F46E5',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' fill='none'%3E%3Cpath d='M22 6L28 10V15L24 13V26C24 27.1 23.1 28 22 28H10C8.9 28 8 27.1 8 26V13L4 15V10L10 6C10 6 12 9 16 9C20 9 22 6 22 6Z' stroke='%236366F1' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M13 16H19' stroke='%236366F1' stroke-width='2.5' stroke-linecap='round'/%3E%3Cpath d='M13 21H16' stroke='%23F43F5E' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">

    <style>
        /* === STRICT NO SCROLL LOCK === */
        html,
        body {
            height: 100vh !important;
            width: 100vw !important;
            overflow: hidden !important;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
        }

        /* === CREATIVE ANIMATED MESH BACKGROUND === */
        .creative-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
            transition: all 0.4s ease;
        }
        
        .creative-bg::before,
        .creative-bg::after,
        .creative-blob {
            content: '';
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.6;
            animation: float 12s infinite alternate ease-in-out;
        }

        .creative-bg::before {
            width: 50vw; height: 50vw;
            max-width: 600px; max-height: 600px;
            background: #818CF8;
            top: -10%; left: -10%;
        }

        .creative-bg::after {
            width: 60vw; height: 60vw;
            max-width: 700px; max-height: 700px;
            background: #C084FC;
            bottom: -20%; right: -10%;
            animation-delay: -5s;
        }

        .creative-blob {
            width: 40vw; height: 40vw;
            max-width: 500px; max-height: 500px;
            background: #38BDF8;
            top: 30%; left: 50%;
            animation-delay: -2s;
        }

        /* Dark Mode blobs */
        html.dark .creative-bg::before { background: #3730A3; opacity: 0.4; }
        html.dark .creative-bg::after { background: #581C87; opacity: 0.4; }
        html.dark .creative-blob { background: #0369A1; opacity: 0.4; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(5%, 10%) scale(1.1); }
        }

        /* === CUSTOM THEME TOGGLE SWITCH === */
        .toggle {
            width: 40px;
            height: 22px;
            position: relative;
            cursor: pointer;
            transition: 0.3s;
            flex-shrink: 0;
        }

        .toggle::before {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            background: white;
            border-radius: 50%;
            top: 2px;
            left: 3px;
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        html.dark .toggle::before {
            left: 19px;
            background: #6366F1;
            box-shadow: none;
        }

        /* === CUSTOM CHECKBOX STYLING === */
        .custom-checkbox input:checked ~ .checkmark {
            background-color: #6366F1;
            border-color: #6366F1;
        }

        .custom-checkbox input:checked ~ .checkmark::after {
            content: '\f00c';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            color: white;
            font-size: 9px;
        }

        html.dark .custom-checkbox input:checked ~ .checkmark::after {
            color: #111827;
        }

        /* RESPONSIVENESS */
        @media (max-width: 400px), (max-height: 750px) {
            html, body {
                height: auto !important;
                min-height: 100vh !important;
                overflow-y: auto !important;
            }
            .main-wrapper {
                align-items: flex-start !important;
                padding-top: 4rem !important;
                padding-bottom: 2rem !important;
            }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body class="bg-[#EEF2FF] dark:bg-slate-900 transition-colors duration-400 flex flex-col relative">

    <!-- UNIQUE DESIGN: Abstract Animated Mesh Background -->
    <div class="creative-bg bg-gradient-to-br from-[#EEF2FF] to-[#E0E7FF] dark:from-slate-900 dark:to-indigo-950">
        <div class="creative-blob"></div>
    </div>

    <!-- TOP BAR -->
    <div class="w-full flex justify-end items-center px-8 py-6 gap-4 z-50 shrink-0 absolute top-0 right-0">
        <div class="flex items-center gap-2 cursor-pointer" onclick="document.getElementById('theme-toggle').click()">
            <i class="fas fa-sun text-xs text-gray-700 dark:text-gray-300 transition-colors duration-300"></i>
            <div class="toggle bg-gray-300 dark:bg-gray-700 border border-white/60 dark:border-white/10 rounded-full" id="theme-toggle"></div>
            <i class="fas fa-moon text-xs text-gray-700 dark:text-gray-300 transition-colors duration-300"></i>
        </div>
        <button id="rtl-toggle" class="text-[0.65rem] font-extrabold text-gray-700 dark:text-gray-200 bg-white/75 dark:bg-slate-800/65 border border-white/60 dark:border-white/10 px-3 py-1.5 rounded-full cursor-pointer transition-colors duration-300 uppercase tracking-wide backdrop-blur-md hover:border-indigo-500 hover:text-indigo-500 dark:hover:border-indigo-400 dark:hover:text-indigo-400">
            RTL Mode
        </button>
    </div>

    <!-- MAIN CENTERED CONTENT -->
    <div class="main-wrapper flex-1 flex items-center justify-center w-full p-4 z-10">
        
        <!-- DECREASED CARD SIZE: max-w-[360px], p-5 sm:p-6, rounded-[20px] -->
        <div class="bg-white dark:bg-black border border-white/60 dark:border-white/10 rounded-[20px] p-5 sm:p-6 w-full max-w-[360px] shadow-[0_25px_50px_-12px_rgba(99,102,241,0.25)] dark:shadow-[0_25px_50px_-12px_rgba(0,0,0,0.8)] flex flex-col gap-2.5 sm:gap-3 relative transition-all duration-300 animate-[slideUp_0.5s_cubic-bezier(0.16,1,0.3,1)_forwards]">

            <!-- PRINTON EXACT LOGO SIZING & PLACEMENT -->
            <div class="flex justify-center mb-1">
                <a href="index.html" class="inline-flex items-center gap-2.5 text-xl font-bold tracking-widest uppercase text-gray-900 dark:text-white transition-colors">
                    <i class="fas fa-print text-indigo-500 text-[1.2rem]"></i>
                    PrintOn
                </a>
            </div>

            <div class="text-center">
                <h2 class="text-[1.1rem] sm:text-xl font-extrabold text-gray-900 dark:text-white mb-0.5 tracking-tight">Create an Account</h2>
                <p class="text-[0.7rem] sm:text-xs text-gray-600 dark:text-gray-400 font-medium hidden sm:block">Join PrintOn to start selling.</p>
            </div>

            <!-- TAILWIND CONVERTED FORM WITH 4 INPUTS (Decreased Heights & Gaps) -->
            <form id="register-form" class="flex flex-col gap-2 sm:gap-2.5 m-0 mt-1">

                <div class="flex flex-col gap-1">
                    <label for="fname" class="text-[0.6rem] font-extrabold text-gray-900 dark:text-white uppercase tracking-wide">First Name</label>
                    <div class="relative flex items-center">
                        <input type="text" id="fname" class="peer w-full h-9 sm:h-10 pl-9 pr-3 rtl:pr-9 rtl:pl-3 border border-gray-200 dark:border-gray-700 bg-white/80 dark:bg-slate-800/70 text-gray-900 dark:text-white rounded-lg text-[0.8rem] font-medium transition-all focus:outline-none focus:border-indigo-500 focus:bg-white dark:focus:bg-slate-900 focus:ring-[3px] focus:ring-indigo-500/15 placeholder-gray-400 dark:placeholder-gray-500 hover:border-indigo-500" placeholder="John" required>
                        <i class="fas fa-user absolute left-3 rtl:left-auto rtl:right-3 text-gray-400 dark:text-gray-500 text-[0.8rem] pointer-events-none transition-colors peer-focus:text-indigo-500"></i>
                    </div>
                </div>

                <div class="flex flex-col gap-1">
                    <label for="lname" class="text-[0.6rem] font-extrabold text-gray-900 dark:text-white uppercase tracking-wide">Last Name</label>
                    <div class="relative flex items-center">
                        <input type="text" id="lname" class="peer w-full h-9 sm:h-10 pl-9 pr-3 rtl:pr-9 rtl:pl-3 border border-gray-200 dark:border-gray-700 bg-white/80 dark:bg-slate-800/70 text-gray-900 dark:text-white rounded-lg text-[0.8rem] font-medium transition-all focus:outline-none focus:border-indigo-500 focus:bg-white dark:focus:bg-slate-900 focus:ring-[3px] focus:ring-indigo-500/15 placeholder-gray-400 dark:placeholder-gray-500 hover:border-indigo-500" placeholder="Doe" required>
                        <i class="fas fa-user absolute left-3 rtl:left-auto rtl:right-3 text-gray-400 dark:text-gray-500 text-[0.8rem] pointer-events-none transition-colors peer-focus:text-indigo-500"></i>
                    </div>
                </div>

                <div class="flex flex-col gap-1">
                    <label for="email" class="text-[0.6rem] font-extrabold text-gray-900 dark:text-white uppercase tracking-wide">Email Address</label>
                    <div class="relative flex items-center">
                        <input type="email" id="email" class="peer w-full h-9 sm:h-10 pl-9 pr-3 rtl:pr-9 rtl:pl-3 border border-gray-200 dark:border-gray-700 bg-white/80 dark:bg-slate-800/70 text-gray-900 dark:text-white rounded-lg text-[0.8rem] font-medium transition-all focus:outline-none focus:border-indigo-500 focus:bg-white dark:focus:bg-slate-900 focus:ring-[3px] focus:ring-indigo-500/15 placeholder-gray-400 dark:placeholder-gray-500 hover:border-indigo-500" placeholder="creator@printon.com" required>
                        <i class="fas fa-envelope absolute left-3 rtl:left-auto rtl:right-3 text-gray-400 dark:text-gray-500 text-[0.8rem] pointer-events-none transition-colors peer-focus:text-indigo-500"></i>
                    </div>
                </div>

                <div class="flex flex-col gap-1">
                    <label for="password" class="text-[0.6rem] font-extrabold text-gray-900 dark:text-white uppercase tracking-wide">Create Password</label>
                    <div class="relative flex items-center">
                        <input type="password" id="password" class="peer w-full h-9 sm:h-10 pl-9 pr-9 rtl:pl-9 rtl:pr-9 border border-gray-200 dark:border-gray-700 bg-white/80 dark:bg-slate-800/70 text-gray-900 dark:text-white rounded-lg text-[0.8rem] font-medium transition-all focus:outline-none focus:border-indigo-500 focus:bg-white dark:focus:bg-slate-900 focus:ring-[3px] focus:ring-indigo-500/15 placeholder-gray-400 dark:placeholder-gray-500 hover:border-indigo-500" placeholder="â€¢â€¢â€¢â€¢â€¢â€¢â€¢â€¢" required>
                        <i class="fas fa-lock absolute left-3 rtl:left-auto rtl:right-3 text-gray-400 dark:text-gray-500 text-[0.8rem] pointer-events-none transition-colors peer-focus:text-indigo-500"></i>
                        <button type="button" class="absolute right-2.5 rtl:right-auto rtl:left-2.5 text-gray-400 dark:text-gray-500 hover:text-indigo-500 p-1 text-xs z-10 transition-colors" id="toggle-password" tabindex="-1" aria-label="Toggle password visibility">
                            <i class="fas fa-eye" id="toggle-icon"></i>
                        </button>
                    </div>
                </div>

                <!-- UTILITY ROW -->
                <div class="flex items-center justify-start mt-0.5">
                    <label class="custom-checkbox flex items-center cursor-pointer relative">
                        <input type="checkbox" class="absolute opacity-0 w-0 h-0 cursor-pointer" required>
                        <div class="checkmark w-3.5 h-3.5 bg-white/80 dark:bg-slate-800/70 border-[1.5px] border-gray-200 dark:border-gray-700 rounded flex items-center justify-center transition-all shrink-0"></div>
                        <span class="ml-2 rtl:ml-0 rtl:mr-2 text-[0.6rem] sm:text-[0.65rem] font-semibold text-gray-600 dark:text-gray-400">

                        </span>
                    </label>
                </div>

                <!-- AUTH BUTTON (Decreased height) -->
                <button type="submit" class="w-full h-9 sm:h-10 mt-1 bg-indigo-500 hover:bg-indigo-600 text-white dark:text-gray-900 border-none rounded-lg text-[0.8rem] font-bold tracking-wide cursor-pointer transition-all flex items-center justify-center gap-2 shadow-[0_4px_10px_0_rgba(99,102,241,0.3)] dark:shadow-[0_4px_10px_0_rgba(129,140,248,0.2)] hover:shadow-[0_8px_15px_-3px_rgba(99,102,241,0.5)] hover:-translate-y-[1px] active:translate-y-0">
                    Register <i class="fas fa-user-plus text-[0.65rem] ml-2 rtl:ml-0 rtl:mr-2"></i>
                </button>
            </form>

            <!-- DIVIDER -->
            <div class="text-center relative my-0.5">
                <div class="absolute left-0 top-1/2 w-full h-[1px] bg-gray-200 dark:bg-gray-800"></div>
                <span class="relative bg-white dark:bg-black px-2 text-gray-600 dark:text-gray-400 text-[0.6rem] font-extrabold uppercase tracking-wide rounded-full z-10">Or sign up with</span>
            </div>

            <!-- SOCIAL BUTTONS (Decreased height) -->
            <div class="flex justify-center gap-2">
                <button class="flex-1 max-w-[100px] h-8 sm:h-9 border-[1.5px] border-gray-200 dark:border-gray-700 rounded-lg bg-white/80 dark:bg-slate-800/70 text-[0.85rem] text-gray-600 dark:text-gray-400 cursor-pointer transition-all flex items-center justify-center hover:border-indigo-500 hover:text-indigo-500 hover:bg-indigo-50 dark:hover:bg-indigo-900/20" type="button" title="Sign up with Google">
                    <i class="fab fa-google"></i>
                </button>
                <button class="flex-1 max-w-[100px] h-8 sm:h-9 border-[1.5px] border-gray-200 dark:border-gray-700 rounded-lg bg-white/80 dark:bg-slate-800/70 text-[0.85rem] text-gray-600 dark:text-gray-400 cursor-pointer transition-all flex items-center justify-center hover:border-indigo-500 hover:text-indigo-500 hover:bg-indigo-50 dark:hover:bg-indigo-900/20" type="button" title="Sign up with Apple">
                    <i class="fab fa-apple"></i>
                </button>
                <button class="flex-1 max-w-[100px] h-8 sm:h-9 border-[1.5px] border-gray-200 dark:border-gray-700 rounded-lg bg-white/80 dark:bg-slate-800/70 text-[0.85rem] text-gray-600 dark:text-gray-400 cursor-pointer transition-all flex items-center justify-center hover:border-indigo-500 hover:text-indigo-500 hover:bg-indigo-50 dark:hover:bg-indigo-900/20" type="button" title="Sign up with X">
                    <i class="fa-brands fa-x-twitter"></i>
                </button>
            </div>

            <div class="text-center text-[0.7rem] text-gray-600 dark:text-gray-400 font-medium mt-0.5">
                Already have an account? <a href="login.html" class="text-indigo-500 font-extrabold transition-all hover:text-indigo-600 hover:underline">Sign In Here</a>
            </div>

        </div>
    </div>

    <script>
        // --- TAILWIND CLASS-BASED THEME LOGIC ---
        const themeToggle = document.getElementById('theme-toggle');
        const savedTheme = localStorage.getItem('theme') || 'light';

        if (savedTheme === 'dark') {
            document.documentElement.classList.add('dark');
            themeToggle.classList.add('active'); // For the physical toggle button switch
        }

        themeToggle.onclick = (e) => {
            e.stopPropagation();
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        };

        // --- RTL LOGIC ---
        const rtlToggle = document.getElementById('rtl-toggle');
        const savedDir = localStorage.getItem('dir') || 'ltr';

        if (savedDir === 'rtl') {
            document.documentElement.dir = 'rtl';
            rtlToggle.innerText = "LTR MODE";
        }

        rtlToggle.onclick = () => {
            const isRTL = document.documentElement.dir === 'rtl';
            document.documentElement.dir = isRTL ? 'ltr' : 'rtl';
            localStorage.setItem('dir', isRTL ? 'ltr' : 'rtl');
            rtlToggle.innerText = isRTL ? 'RTL MODE' : 'LTR MODE';
        };

        // --- PASSWORD TOGGLE LOGIC ---
        const togglePasswordBtn = document.getElementById('toggle-password');
        const passwordInput = document.getElementById('password');
        const toggleIcon = document.getElementById('toggle-icon');

        togglePasswordBtn.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            toggleIcon.className = type === 'password' ? 'fas fa-eye' : 'fas fa-eye-slash';
        });

        // --- FORM SUBMISSION ---
        document.getElementById('register-form').addEventListener('submit', (e) => {
            e.preventDefault();
            // Redirecting to login upon successful registration
            window.location.href = 'login.html';
        });
    </script>
</body>

</html>
